<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report
		     anything other than 0; the layout pays those insets back. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- Both feeds, discoverable from every page rather than only from
		     /news — a reader looks in the head of whatever it was handed. -->
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Workshop Europa — news"
			href="%sveltekit.assets%/news/rss.xml"
		/>
		<link
			rel="alternate"
			type="application/atom+xml"
			title="Workshop Europa — news"
			href="%sveltekit.assets%/news/atom.xml"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
