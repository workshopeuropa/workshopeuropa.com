<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report
		     anything other than 0; the layout pays those insets back. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- Both weights of Areal, started with the HTML rather than after the
		     CSS has parsed and the first character has been laid out. Both are
		     on every page — the regular is the running text and the medium is
		     every small label — so neither is a speculative fetch. crossorigin
		     is required even same-origin: a font is fetched in CORS mode, and a
		     preload without it is discarded and fetched again. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/ABCArealSemiMono-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/ABCArealSemiMono-Medium.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Both feeds, discoverable from every page rather than only from
		     /news — a reader looks in the head of whatever it was handed. -->
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Workshop Europa — news"
			href="%sveltekit.assets%/news/rss.xml"
		/>
		<link
			rel="alternate"
			type="application/atom+xml"
			title="Workshop Europa — news"
			href="%sveltekit.assets%/news/atom.xml"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
